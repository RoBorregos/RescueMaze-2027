[platformio]
default_envs = teensy41

[env]
platform = teensy
board = teensy41
framework = arduino
build_flags =
    -Wall
    -Wextra
    -Iinclude
    -Itest
monitor_speed = 115200
test_speed = 115200

[bno08x]
lib_deps = https://github.com/adafruit/Adafruit_BNO08x/archive/refs/tags/1.2.7.zip

[vlx]
lib_deps = https://github.com/adafruit/Adafruit_VL53L0X/archive/refs/tags/1.2.5.zip

[chassis]
build_src_filter =
    +<motors.cpp>
    +<motor.cpp>
    +<Encoder.cpp>
    +<PID.cpp>

[env:teensy41]
lib_deps =
    ${bno08x.lib_deps}
    ${vlx.lib_deps}
build_src_filter = ${chassis.build_src_filter} +<movements.cpp> +<BNO.cpp> +<VLX.cpp> +<maze.cpp> +<main.cpp>
test_filter =
    test_8_vlx
    test_i2c_scan
    test_bno

[env:lecturas_vlx]
test_filter = test_lecturas_vlx
lib_deps = ${vlx.lib_deps}

[env:lecturas_bno]
lib_deps = ${bno08x.lib_deps}
test_filter = test_lecturas_bno

[env:vlx_filtrado]
lib_deps = ${vlx.lib_deps}
test_filter = test_vlx_filtrado
test_build_src = yes
build_src_filter = +<VLX.cpp>

[env:calibracion_bno]
lib_deps = ${bno08x.lib_deps}
test_filter = test_calibracion_bno
test_build_src = yes
build_src_filter = +<BNO.cpp>

[env:calibracion_tcs]
test_filter = test_calibracion_tcs
test_build_src = yes
build_src_filter = +<TCS.cpp>

[env:motores_encoders]
test_filter = test_motores_encoders

[env:avance_distancia]
test_filter = test_avance_distancia
test_build_src = yes
build_src_filter = ${chassis.build_src_filter} +<movements.cpp>

[env:comandos_movimiento]
lib_deps = ${bno08x.lib_deps}
test_filter = test_comandos_movimiento
test_build_src = yes
build_src_filter = ${chassis.build_src_filter} +<movements.cpp> +<BNO.cpp>

[env:ajuste_pid]
test_filter = test_ajuste_pid
test_build_src = yes
build_src_filter = ${chassis.build_src_filter}
