[platformio]
default_envs = teensy41
extra_configs = test/platformio.local.ini

[env]
platform = teensy
board = teensy41
framework = arduino
build_flags =
    -Wall
    -Wextra
    -Iinclude
    -Itest
monitor_speed = 115200

[bno08x]
lib_deps = https://github.com/adafruit/Adafruit_BNO08x/archive/refs/tags/1.2.7.zip

[vlx]
lib_deps = https://github.com/adafruit/Adafruit_VL53L0X/archive/refs/tags/1.2.5.zip

[env:teensy41]
lib_deps =
    ${bno08x.lib_deps}
    ${vlx.lib_deps}
    adafruit/Adafruit SSD1306 @ 2.5.17
build_src_filter = +<*>
